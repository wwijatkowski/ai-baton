name: Marketplace identity check

# Temporary: signs in as the publishing managed identity, prints the id the Marketplace knows it by (to add it to the
# publisher's Members) and checks whether it can already manage publisher wwijatkowski. Deleted once that works.
on:
  push:
    branches: [marketplace-identity]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Identity as Azure DevOps and the Marketplace see it
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query "{id: id, displayName: displayName}" -o json
      # The real test: publish the released 0.4.0 again. Without publisher rights the Marketplace refuses; with them
      # it is skipped as already published, so nothing changes.
      - uses: actions/checkout@v4
        with:
          ref: v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package 0.4.0
        run: sh scripts/package.sh
      - name: Publish as the identity (0.4.0 exists, so it is skipped)
        run: npx --yes @vscode/vsce@4.0.0 publish --packagePath ai-baton-0.4.0.vsix --skip-duplicate --azure-credential
